<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track list – Ariana Grande</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="albums.html" class="active">Albums</a></li>
        <li><a href="musique.html">Musique</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <a class="back" href="albums.html">← Retour aux albums</a>

      <div class="head">
        <div class="cover" id="cover"></div>
        <div class="meta">
          <small>Track list</small>
          <h1 id="title"></h1>
          <p id="info"></p>
        </div>
      </div>

      <div class="actions" id="actions">
        <button class="btn-ghost" id="addall" type="button">＋ Tout ajouter à ma playlist</button>
        <a class="btn-ghost" href="playlist.html">Ouvrir ma playlist</a>
      </div>

      <!-- Lecteur Spotify -->
      <div id="lecteur"><div id="embed"></div></div>

      <ol class="tracks" id="tracks"></ol>

      <div id="factsbox"></div>

      <nav class="pn" id="pn" aria-label="Changer d'album"></nav>
    </div>
  </main>

  <footer>
    <p>Site de fan non officiel · Fait avec 💜</p>
  </footer>

  <script src="data.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("album");
    const a = AG.get(id);

    if (!a) {
      document.getElementById("title").textContent = "Album introuvable";
      document.getElementById("cover").remove();
      document.getElementById("lecteur").remove();
      document.getElementById("actions").remove();
    } else {
      document.title = "Track list – " + a.title + " – Ariana Grande";
      document.getElementById("title").textContent = a.title;
      document.getElementById("info").textContent =
        "Ariana Grande · " + a.year + " · " + a.tracks.length + " titres";

      // Pochette
      const cover = document.getElementById("cover");
      cover.style.background = a.bg;
      cover.textContent = a.year;
      const img = document.createElement("img");
      AG.setImg(img, a);
      cover.appendChild(img);

      // Tout ajouter à la playlist
      document.getElementById("addall").addEventListener("click", () => {
        let n = 0;
        a.tracks.forEach((t, i) => { if (AG.pl.add(a.key + ":" + (i + 1))) n++; });
        AG.toast(n ? n + " titres ajoutés à ta playlist ✓" : "Tout est déjà dans ta playlist");
      });

      // Lecteur Spotify (API officielle, permet de changer de morceau)
      let controller = null;
      if (a.spotify) {
        AG.spotify((IFrameAPI) => {
          IFrameAPI.createController(
            document.getElementById("embed"),
            { uri: "spotify:album:" + a.spotify, width: "100%", height: 352 },
            (c) => { controller = c; }
          );
        });
      }

      // Liste des titres (cliquables, accessibles au clavier)
      const list = document.getElementById("tracks");
      a.tracks.forEach((t, i) => {
        const tid = a.key + ":" + (i + 1);
        const li = document.createElement("li");
        li.innerHTML =
          '<button type="button" class="tbtn"><span class="n"></span><span class="t"></span></button>' +
          '<span class="acts"></span>';
        li.querySelector(".n").textContent = i + 1;
        li.querySelector(".t").textContent = t;
        li.querySelector(".acts").append(AG.heart(tid), AG.plus(tid));

        li.addEventListener("click", (e) => {
          if (e.target.closest(".acts")) return;
          if (controller && a.ids[i]) {
            list.querySelectorAll("li").forEach(x => x.classList.remove("playing"));
            li.classList.add("playing");
            controller.loadUri("spotify:track:" + a.ids[i]);
            controller.play();
            document.getElementById("lecteur").scrollIntoView({ behavior: "smooth", block: "center" });
          } else {
            window.open(
              "https://open.spotify.com/search/" + encodeURIComponent(t + " Ariana Grande"),
              "_blank"
            );
          }
        });

        list.appendChild(li);
      });

      // À savoir (anecdotes de l'album)
      if (a.facts && a.facts.length) {
        document.getElementById("factsbox").innerHTML =
          '<h2 class="facts-title">À savoir</h2>' +
          a.facts.map(f => '<div class="fact">' + AG.esc(f) + "</div>").join("");
      }

      // Album précédent / suivant
      const keys = AG.albums.map(x => x.key), k = keys.indexOf(id);
      const link = (j, dir) => '<a href="tracklist.html?album=' + keys[j] + '">' +
        (dir < 0 ? "← " : "") + AG.albums[j].title + (dir > 0 ? " →" : "") + "</a>";
      document.getElementById("pn").innerHTML =
        (k > 0 ? link(k - 1, -1) : "<span></span>") +
        (k < keys.length - 1 ? link(k + 1, 1) : "<span></span>");
    }
  </script>
  <script src="script.js" defer></script>
</body>
</html>
