<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track list – Ariana Grande</title>
  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; color:#fff; background-color:#121212;
      background-image: linear-gradient(180deg, #5b3a8c, #121212 500px); background-repeat:no-repeat; }
    a { color:#fff; text-decoration:none; }
    ul { list-style:none; margin:0; padding:0; display:flex; gap:10px; flex-wrap:wrap; }
    header, footer { padding:16px 32px; }
    nav a { display:block; padding:8px 16px; border-radius:999px; background:rgba(255,255,255,0.12); }
    nav a.active { background:#1ed760; color:#000; }
    main { padding:16px 32px; }
    .container { max-width:960px; margin:0 auto; }
    small { color:#b3b3b3; }
    h1 { font-size:56px; margin:4px 0 8px; line-height:1; }
    .back { display:inline-block; margin:8px 0 24px; color:#b3b3b3; }
    .back:hover { color:#fff; }
    .head { display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; margin-bottom:32px; }
    .cover { position:relative; width:220px; height:220px; flex-shrink:0; border-radius:8px; overflow:hidden;
      display:flex; align-items:flex-end; padding:10px; box-sizing:border-box; font-weight:bold; font-size:14px;
      color:rgba(255,255,255,0.85); box-shadow:0 8px 24px rgba(0,0,0,0.4); }
    .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .meta p { margin:0; color:#b3b3b3; }
    .tracks { list-style:none; margin:0; padding:0; }
    .tracks li { display:flex; align-items:center; gap:20px; padding:12px 16px; border-radius:6px; transition:background .2s; }
    .tracks li:hover { background:rgba(255,255,255,0.1); }
    .tracks .n { width:24px; text-align:right; color:#b3b3b3; }
    .tracks .t { font-size:16px; }
    footer { color:#b3b3b3; }
  </style>
</head>
<body>

  <header>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="albums.html" class="active">Albums</a></li>
        <li><a href="#">Musique</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <a class="back" href="albums.html">← Retour aux albums</a>

      <div class="head">
        <div class="cover" id="cover"></div>
        <div class="meta">
          <small>Track list</small>
          <h1 id="title"></h1>
          <p id="info"></p>
        </div>
      </div>

      <ol class="tracks" id="tracks"></ol>
    </div>
  </main>

  <footer>
    <p></p>
  </footer>

  <script>
    const albums = {
      "yours-truly": {
        title: "Yours Truly", year: "2013", img: "yours truly.jpg",
        bg: "linear-gradient(135deg, #f4c6d8, #b98fd1)",
        tracks: ["Honeymoon Avenue","Baby I","Right There (feat. Big Sean)","Tattooed Heart","Lovin' It","Piano","Daydreamin'","The Way (feat. Mac Miller)","You'll Never Know","Almost Is Never Enough (with Nathan Sykes)"]
      },
      "my-everything": {
        title: "My Everything", year: "2014", img: "my evrything.jpg",
        bg: "linear-gradient(135deg, #2b2b2b, #8a8a8a)",
        tracks: ["Intro","Problem (feat. Iggy Azalea)","One Last Time","Why Try","Break Free (feat. Zedd)","Best Mistake (feat. Big Sean)","Be My Baby (feat. Cashmere Cat)","Break Your Heart Right Back (feat. Childish Gambino)","Love Me Harder (with The Weeknd)","Just a Little Bit of Your Heart","Hands on Me (feat. A$AP Ferg)","My Everything"]
      },
      "dangerous-woman": {
        title: "Dangerous Woman", year: "2016", img: "dangerous woman.jpg",
        bg: "linear-gradient(135deg, #111111, #6b6b6b)",
        tracks: ["Moonlight","Dangerous Woman","Be Alright","Into You","Side to Side (feat. Nicki Minaj)","Let Me Love You (feat. Lil Wayne)","Greedy","Leave Me Lonely (feat. Macy Gray)","Everyday (feat. Future)","Sometimes","I Don't Care","Bad Decisions","Touch It","Knew Better / Forever Boy","Thinking Bout You"]
      },
      "sweetener": {
        title: "Sweetener", year: "2018", img: "sweetener.jpg",
        bg: "linear-gradient(135deg, #8fd3f4, #84fab0)",
        tracks: ["raindrops (an angel cried)","blazed (feat. Pharrell Williams)","the light is coming (feat. Nicki Minaj)","R.E.M","God is a woman","sweetener","successful","everytime","breathin","no tears left to cry","borderline (feat. Missy Elliott)","better off","goodnight n go","pete davidson","get well soon"]
      },
      "thank-u-next": {
        title: "thank u, next", year: "2019", img: "thank u next.jpg",
        bg: "linear-gradient(135deg, #ff9ecb, #ffd1e8)",
        tracks: ["imagine","needy","NASA","bloodline","fake smile","bad idea","make up","ghostin","in my head","7 rings","thank u, next","break up with your girlfriend, i'm bored"]
      },
      "positions": {
        title: "Positions", year: "2020", img: "position.jpg",
        bg: "linear-gradient(135deg, #7a4fb0, #e0a96d)",
        tracks: ["shut up","34+35","motive (with Doja Cat)","just like magic","off the table (with The Weeknd)","six thirty","safety net (feat. Ty Dolla $ign)","my hair","nasty","west side","love language","positions","obvious","pov"]
      },
      "eternal-sunshine": {
        title: "eternal sunshine", year: "2024", img: "eternel sunshine.jpg",
        bg: "linear-gradient(135deg, #dfe9f3, #a8c0ff)",
        tracks: ["intro (end of the world)","bye","don't wanna break up again","Saturn returns interlude","eternal sunshine","supernatural","twilight zone","true story","the boy is mine","yes, and?","we can't be friends (wait for your love)","i wish i hated you","imperfect for you"]
      },
            "petal": {
        title: "petal", year: "2026", img: "petal.jpg",
        bg: "linear-gradient(135deg, #c9d6c3, #f2efe6)",
        tracks: ["kiss me","hate that i made you love me","petal","stay","oh well","big feelings","freak","(warning signs)","like i do","never get over me","bad thing (bunny hop)","nowhere, nobody"]
      }
    };

    const id = new URLSearchParams(location.search).get("album");
    const a = albums[id];

    if (!a) {
      document.getElementById("title").textContent = "Album introuvable";
      document.getElementById("cover").remove();
    } else {
      document.title = "Track list – " + a.title + " – Ariana Grande";
      document.getElementById("title").textContent = a.title;
      document.getElementById("info").textContent =
        "Ariana Grande · " + a.year + " · " + a.tracks.length + " titres";

      const cover = document.getElementById("cover");
      cover.style.background = a.bg;
      cover.textContent = a.year;
      const img = document.createElement("img");
      img.src = a.img;
      img.alt = "Pochette de " + a.title;
      img.onerror = () => img.remove();
      cover.appendChild(img);

      const list = document.getElementById("tracks");
      a.tracks.forEach((t, i) => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="t"></span>';
        li.querySelector(".t").textContent = t;
        list.appendChild(li);
      });
    }
  </script>

</body>
</html>
